<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capivara Bot 🐹</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-container">
    <header>
      <h1>🐹 Capivara Bot</h1>
      <p>Pergunte qualquer coisa sobre capivaras!</p>
    </header>

    <div id="mensagens" class="mensagens"></div>

    <form id="form-chat" class="form-chat">
      <input
        id="input-pergunta"
        type="text"
        placeholder="Ex: capivaras são perigosas?"
        autocomplete="off"
        required
      />
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
